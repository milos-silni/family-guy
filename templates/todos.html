{{define "content"}}
<form class="add" method="post" action="/todos" data-ajax>
  <input name="title" placeholder="Add a task…" aria-label="Task" maxlength="200" autocomplete="off" enterkeyhint="done" required>
  <button type="submit" aria-label="Add task">+</button>
</form>

<div id="list">
{{with .Data}}
  {{if .Items}}
  <ul class="list">
    {{range .Items}}
    <li{{if .Done}} class="done"{{end}}>
      <form method="post" action="/todos/{{.ID}}/toggle" data-ajax>
        <button class="check" aria-label="{{if .Done}}Mark {{.Title}} as not done{{else}}Mark {{.Title}} as done{{end}}"></button>
      </form>
      <div class="text">
        <span class="title">{{.Title}}</span>
        {{if .AddedBy}}<small>{{.AddedBy}}</small>{{end}}
      </div>
      <form method="post" action="/todos/{{.ID}}/delete" data-ajax>
        <button class="delete" aria-label="Delete {{.Title}}">×</button>
      </form>
    </li>
    {{end}}
  </ul>
  {{if .DoneCount}}
  <form method="post" action="/todos/clear" data-ajax class="center">
    <button class="secondary">Clear {{.DoneCount}} completed</button>
  </form>
  {{end}}
  {{else}}
  <p class="empty">Nothing to do. Nice!</p>
  {{end}}
{{end}}
</div>
{{end}}
